<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Latar belakang bergradasi hijau zamrud modern -->
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Bentuk dasar melengkung lembut (Squircle) -->
  <rect width="64" height="64" rx="18" fill="url(#emeraldGrad)" />
  
  <!-- Ikon Monogram huruf "M" untuk Magelang (Garis tegas ala C2/Komando) -->
  <path d="M 16 46 L 16 22 L 32 36 L 48 22 L 48 46" 
        stroke="white" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        filter="url(#shadow)" />
</svg>
